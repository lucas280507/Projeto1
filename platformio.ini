; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

; Gravação pela USB (obrigatória na primeira vez)
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; Gravação pela rede Wi-Fi (OTA)
[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = 10.57.134.82
upload_flags =
    --port=8266
    --auth=projeto-ota-123